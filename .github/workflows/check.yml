# The project check and the web build on every push to main and every pull request:
# Biome, tsc, knip, the rule tests, the fast-check properties, the shipped solved tables
# and the version 1 saves (`npm run check`), then `vite build`. The Playwright
# playthroughs (`npm run e2e`) stay local: on a runner without a GPU the 3D-table tests
# need minutes, and a slow test is deleted, not patched (plan decision P12).
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
