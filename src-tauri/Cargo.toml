[package]
name = "noughty-crosses"
version = "1.0.0"
description = "Noughty Crosses: tic-tac-toe modes on a crafted 3D table"
authors = ["David-Xilo"]
license = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "noughty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
steamworks = { version = "0.13.1", optional = true }
serde = { version = "1", features = ["derive"] }

# Controllers on Linux, where the web view has no Gamepad API (P20).
[target.'cfg(target_os = "linux")'.dependencies]
gilrs = "0.11.2"

[features]
# The Steam build (TTT-4.3.2): `npm run desktop:steam`. Other builds carry no Steam library.
steam = ["dep:steamworks"]
